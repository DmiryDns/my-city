<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск достопримечательностей | Нижний Новгород</title>
    <style>
        /* --- БАЗОВЫЕ НАСТРОЙКИ --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #e4e2dc; color: #333; line-height: 1.6; }

        /* --- ШАПКА --- */
        .page-header { background: #938275; padding: 15px 5%; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .back-btn { color: white; text-decoration: none; font-weight: bold; font-size: 1.1rem; display: inline-flex; align-items: center; gap: 10px; transition: color 0.3s; }
        .back-btn:hover { color: #e4e2dc; }

        /* --- ГРОМКИЙ ЗАГОЛОВОК --- */
        .hero-title-section { text-align: center; padding: 60px 20px 40px; background: linear-gradient(180deg, #e4e2dc 0%, #d6d2c9 100%); }
        .hero-title { font-size: 3.5rem; font-weight: 900; color: #000; text-transform: uppercase; letter-spacing: 2px; line-height: 1.1; margin-bottom: 15px; text-shadow: 1px 1px 2px rgba(147, 130, 117, 0.3); }
        .hero-subtitle { font-size: 1.3rem; color: #938275; font-weight: 500; }

        /* --- ПОИСК --- */
        .search-container { max-width: 700px; margin: 0 auto 50px; padding: 0 20px; position: relative; }
        .search-input { width: 100%; padding: 18px 25px; font-size: 1.1rem; border: 2px solid #c9bfb2; border-radius: 50px; background: #fff; color: #333; outline: none; transition: border-color 0.3s, box-shadow 0.3s; box-shadow: 0 5px 15px rgba(147, 130, 117, 0.1); }
        .search-input:focus { border-color: #938275; box-shadow: 0 5px 20px rgba(147, 130, 117, 0.3); }
        .search-icon { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); font-size: 1.3rem; color: #938275; pointer-events: none; }

        /* --- СЕТКА КАРТОЧЕК --- */
        .cards-section { max-width: 1300px; margin: 0 auto 80px; padding: 0 5%; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }

        /* --- КАРТОЧКА 3:4 --- */
        .card { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(147, 130, 117, 0.2); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; display: flex; flex-direction: column; text-decoration: none; color: inherit; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(147, 130, 117, 0.4); }
        .card-image { width: 100%; aspect-ratio: 3 / 4; background-size: cover; background-position: center; position: relative; }
        
        .rating-badge { position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.95); color: #000; padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 5px; }
        .rating-badge .star { color: #f1c40f; font-size: 1.1rem; }

        .card-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.3rem; font-weight: 800; color: #000; margin-bottom: 8px; line-height: 1.2; }
        .card-desc { font-size: 0.9rem; color: #555; line-height: 1.4; }

        .no-results { text-align: center; font-size: 1.2rem; color: #938275; grid-column: 1 / -1; padding: 40px; display: none; }

        /* --- ПОДВАЛ --- */
        footer { background: #938275; color: white; text-align: center; padding: 30px; }
        footer p { opacity: 0.9; font-size: 0.9rem; }

        /* --- АДАПТАЦИЯ --- */
        @media (max-width: 900px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .hero-title { font-size: 2.2rem; }
            .cards-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="page-header">
        <a href="index.html" class="back-btn">← На главную</a>
    </header>

    <!-- Громкий заголовок -->
    <section class="hero-title-section">
        <h1 class="hero-title">Нижний Новгород —<br>город трудовой доблести</h1>
        <p class="hero-subtitle">Откройте для себя историю и красоту города</p>
    </section>

    <!-- Поиск -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию, описанию или ключевым словам...">
        <span class="search-icon">🔍</span>
    </div>

    <!-- Сетка карточек -->
    <section class="cards-section">
        <div class="cards-grid" id="cardsGrid">
            <!-- Карточки будут добавлены автоматически скриптом -->
        </div>
        <div class="no-results" id="noResults">Ничего не найдено. Попробуйте изменить запрос.</div>
    </section>

    <footer>
        <p>&copy; 2026 Мой город. Авторский путеводитель по Нижнему Новгороду.</p>
    </footer>

    <!-- СКРИПТ: Читаем JSON и строим карточки -->
    <script>
        // Находим контейнер для карточек
        const grid = document.getElementById('cardsGrid');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        let allPlaces = []; // Сюда сохраним все места

        // Загружаем JSON-файл
        fetch('places.json')
            .then(response => response.json())
            .then(data => {
                allPlaces = data;
                renderCards(allPlaces);
            })
            .catch(error => {
                console.error('Ошибка загрузки JSON:', error);
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Не удалось загрузить данные. Проверьте, что файл places.json лежит рядом с poisk.html и запущен локальный сервер или Netlify.</p>';
            });

        // Функция для отрисовки карточек
        function renderCards(places) {
            grid.innerHTML = ''; // Очищаем контейнер
            
            places.forEach(place => {
                const card = document.createElement('a');
                card.href = '#'; // Пока никуда не ведёт
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="card-image" style="background-image: url('${place.img}');">
                        <div class="rating-badge"><span class="star">★</span> ${place.rating}</div>
                    </div>
                    <div class="card-info">
                        <h3 class="card-title">${place.name}</h3>
                        <p class="card-desc">${place.desc}</p>
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Поиск
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            
            if (query === '') {
                renderCards(allPlaces);
                noResults.style.display = 'none';
                return;
            }
            
            const filtered = allPlaces.filter(place => {
                const name = place.name.toLowerCase();
                const desc = place.desc.toLowerCase();
                const keywords = place.keywords.toLowerCase();
                
                return name.includes(query) || desc.includes(query) || keywords.includes(query);
            });
            
            renderCards(filtered);
            
            if (filtered.length === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        });
    </script>

</body>
</html>
